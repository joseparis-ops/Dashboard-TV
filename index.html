<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Mediciones de TV</title>
  <!-- Tailwind CSS -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <!-- Supabase JS Client -->
  <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl mb-4 border border-blue-500/30">
        <i class="fa-solid fa-tv text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">Acceso al Dashboard</h1>
      <p class="text-sm text-slate-400">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Alert de Error / Éxito -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

    <!-- Formulario -->
    <form id="login-form" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Correo Electrónico</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="usuario@empresa.com"
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-200 placeholder-slate-500 outline-none transition"
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </div>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-200 placeholder-slate-500 outline-none transition"
          >
        </div>
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 flex items-center justify-center space-x-2"
      >
        <span>Iniciar Sesión</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = '[https://sotvmiyeinoldidpvyhd.supabase.co](https://sotvmiyeinoldidpvyhd.supabase.co)';
    const SUPABASE_KEY = 'sb_publishable_QK06zg7-6l6wqitqfGPefA_zimMKk4N';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    }
    checkExistingSession();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verificando...</span>';
      showAlert('', 'hidden');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        showAlert('Inicio de sesión correcto. Redirigiendo...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);

      } catch (error) {
        showAlert(error.message || 'Error al iniciar sesión. Revisa tus credenciales.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Iniciar Sesión</span> <i class="fa-solid fa-arrow-right text-sm"></i>';
      }
    });

    function showAlert(message, type) {
      if (type === 'hidden') {
        alertBox.className = 'hidden mb-6 p-4 rounded-xl text-sm border';
        return;
      }

      alertBox.classList.remove('hidden');
      if (type === 'error') {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-red-500/10 border-red-500/30 text-red-400';
      } else if (type === 'success') {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
      }
      alertBox.textContent = message;
    }
  </script>
</body>
</html>
